<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harrison Brandt | Industrial & Systems Engineering</title>
  <meta name="description" content="Industrial and Systems Engineering student at the University of Iowa specializing in AI-enabled operations and virtual design." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --titanium-base: #e5e5e3;
      --card-face: linear-gradient(135deg, #f6f6f5 0%, #ebebea 48%, #dfdfdd 100%);
      --border-outer: #cdcdc9;
      --border-chamfer: #ffffff;
      --metal-bevel: inset 0 1.5px 0 rgba(255, 255, 255, 0.95), inset 0 -1.5px 0 rgba(0, 0, 0, 0.12);
      
      --text: #1b1c1d;
      --text-muted: #5e6065;
      --text-spec: #77797e;
      --accent-etch: #121314;
      --chip-border: #c8c8c4;
      --chip-gold: linear-gradient(135deg, #e6ca97 0%, #d8b475 50%, #c49a52 100%);

      /* Laser Specs */
      --laser-core: #ffffff;
      --laser-plasma: #00d2ff;
      --laser-flare: rgba(0, 210, 255, 0.9);

      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --font-spec: 'Space Mono', monospace;
      --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--titanium-base);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Ambient Desktop Reflection */
    .viewport-scene {
      perspective: 1200px;
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: center;
    }

    /* Apple Titanium Card Proportions (1.586 : 1 Ratio) */
    .titanium-card {
      width: 100%;
      aspect-ratio: 1.586 / 1;
      background: var(--card-face);
      border: 1px solid var(--border-outer);
      border-radius: 20px;
      padding: 40px 48px;
      position: relative;
      box-shadow: 
        0 30px 60px -12px rgba(50, 50, 73, 0.18),
        0 18px 36px -18px rgba(0, 0, 0, 0.15),
        var(--metal-bevel);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
    }

    /* Machined Chamfer Inner Rim */
    .titanium-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 19px;
      border: 1px solid var(--border-chamfer);
      opacity: 0.6;
      pointer-events: none;
    }

    /* Card Header: Chip and Serial */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .smart-chip {
      width: 52px;
      height: 40px;
      border-radius: 6px;
      background: var(--chip-gold);
      border: 1px solid var(--chip-border);
      position: relative;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6), 0 1px 2px rgba(0,0,0,0.08);
      opacity: 0.9;
    }

    .smart-chip::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0, 0, 0, 0.15);
    }

    .smart-chip::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(0, 0, 0, 0.15);
    }

    .serial-stamp {
      font-family: var(--font-spec);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--text-spec);
      text-transform: uppercase;
    }

    /* Laser Etching Engine (Name Section) */
    .card-middle {
      position: relative;
      margin: auto 0;
    }

    .laser-container {
      position: relative;
      display: inline-block;
    }

    h1.etched-name {
      font-size: 2.1rem;
      font-weight: 500;
      letter-spacing: -0.035em;
      color: transparent;
      line-height: 1.1;
      white-space: nowrap;
      transition: color 0.4s ease, text-shadow 0.6s ease;
    }

    .laser-beam {
      position: absolute;
      top: -10%;
      bottom: -10%;
      left: 0;
      width: 3px;
      background: var(--laser-core);
      box-shadow: 0 0 14px 4px var(--laser-plasma), 0 0 32px 10px var(--laser-flare);
      pointer-events: none;
      opacity: 0;
      z-index: 10;
    }

    .laser-beam::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 20px 8px #ffffff, 0 0 36px 12px var(--laser-plasma);
    }

    body.is-etching .laser-beam {
      opacity: 1;
      animation: sweepEtch 2.3s var(--ease-apple) forwards;
    }

    body.is-etching h1.etched-name {
      animation: burnMetal 2.3s var(--ease-apple) forwards;
    }

    @keyframes sweepEtch {
      0% { left: 0%; opacity: 1; }
      85% { left: 100%; opacity: 1; }
      100% { left: 100%; opacity: 0; }
    }

    @keyframes burnMetal {
      0% { color: transparent; }
      30% { color: var(--laser-core); text-shadow: 0 0 12px var(--laser-plasma), 0 0 24px var(--laser-flare); }
      75% { color: var(--laser-core); text-shadow: 0 0 8px var(--laser-plasma); }
      100% {
        color: var(--accent-etch);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8), 0 -1px 0 rgba(0, 0, 0, 0.45);
      }
    }

    body.etching-complete h1.etched-name {
      color: var(--accent-etch);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8), 0 -1px 0 rgba(0, 0, 0, 0.45);
    }

    /* Sub-credential revealed after burn */
    .discipline-title {
      font-family: var(--font-spec);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--text-spec);
      text-transform: uppercase;
      margin-top: 6px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.8s var(--ease-apple), transform 0.8s var(--ease-apple);
    }

    body.etching-complete .discipline-title {
      opacity: 1;
      transform: translateY(0);
    }

    /* Card Footer: Navigation Pages & Status */
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s var(--ease-apple), transform 0.8s var(--ease-apple);
    }

    body.etching-complete .card-bottom {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-links {
      display: flex;
      gap: 22px;
    }

    .card-link {
      font-family: var(--font-spec);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .card-link:hover {
      color: var(--text-spec);
      transform: translateY(-1px);
    }

    .affiliation-stamp {
      text-align: right;
      font-family: var(--font-spec);
      font-size: 0.72rem;
      color: var(--text-spec);
      line-height: 1.4;
      text-transform: uppercase;
    }

    /* Responsiveness for small screens */
    @media (max-width: 640px) {
      .titanium-card {
        padding: 24px;
        border-radius: 16px;
      }
      h1.etched-name {
        font-size: 1.4rem;
      }
      .smart-chip {
        width: 42px;
        height: 32px;
      }
      .nav-links {
        gap: 12px;
      }
      .card-link {
        font-size: 0.7rem;
      }
      .affiliation-stamp {
        display: none;
      }
    }
  </style>
</head>
<body class="is-etching">

  <div class="viewport-scene">
    <div class="titanium-card">
      
      <!-- Top Rail: Chip & Spec Number -->
      <div class="card-top">
        <div class="smart-chip" aria-hidden="true"></div>
        <div class="serial-stamp">SPEC // UI-ISE-2028</div>
      </div>

      <!-- Center: Etched Identity -->
      <div class="card-middle">
        <div class="laser-container">
          <h1 class="etched-name">Harrison Brandt</h1>
          <div class="laser-beam"></div>
        </div>
        <div class="discipline-title">Industrial & Systems Engineering · University of Iowa</div>
      </div>

      <!-- Bottom Rail: Distinct Page Portals & Details -->
      <div class="card-bottom">
        <nav class="nav-links">
          <a class="card-link" href="experience.html">Experience ↗</a>
          <a class="card-link" href="projects.html">Projects ↗</a>
          <a class="card-link" href="contact.html">Contact ↗</a>
        </nav>
        <div class="affiliation-stamp">
          <div>Six Sigma White Belt[cite: 1]</div>
          <div>GymACT All-Star[cite: 1]</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Execute laser manufacturing sequence on initial arrival
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.body.classList.remove('is-etching');
        document.body.classList.add('etching-complete');
      }, 2300);
    });
  </script>
</body>
</html>
